version: '3.8'

services:
  # 1. MongoDB 7.0 - Single Source of Truth for Tenancy, Quotas, and Auth
  mongodb:
    image: mongo:7.0
    container_name: toowix-prod-mongodb
    restart: always
    volumes:
      - toowix-prod-mongodata:/data/db
    networks:
      - toowix-internal
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Stalwart Mail Server (Community Edition) - Mail Delivery & Storage Engine Only
  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: toowix-prod-stalwart
    restart: always
    environment:
      - STALWART_RECOVERY_ADMIN=admin:ToowixServiceSecret2026!Secure
    # CRITICAL SECURITY INVARIANT:
    # Stalwart Management API (8080) is NEVER exposed on host or public network.
    # It is strictly reachable ONLY on toowix-internal by Toowix Backend.
    ports:
      # Management Web UI & API — exposed on all interfaces so backend container
      # can reach it via host.docker.internal. Firewall (ufw/iptables) should
      # restrict external access to port 8080 if needed.
      - "${PORT_STALWART_ADMIN:-8080}:8080"
      # Public Mail Protocol Ports
      - "25:25"       # SMTP MX inbound
      - "587:587"     # SMTP Submission
      - "465:465"     # SMTPS Submission
      - "993:993"     # IMAPS
      - "143:143"     # IMAP (STARTTLS)
      - "4190:4190"   # ManageSieve
    volumes:
      - toowix-prod-stalwart-etc:/etc/stalwart
      - toowix-prod-stalwart-data:/var/lib/stalwart
    networks:
      - toowix-internal
      - toowix-public

  # 3. Toowix Backend - Multi-Tenant Control Plane & API Service
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: toowix-prod-backend
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/toowix_mail
      JWT_SECRET: ${JWT_SECRET}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      GODADDY_CREDENTIAL_ENCRYPTION_KEY: ${GODADDY_CREDENTIAL_ENCRYPTION_KEY}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
      ALERT_EMAIL: ${ALERT_EMAIL}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      STALWART_URL: ${STALWART_URL:-http://stalwart:8080}
      STALWART_USER: ${STALWART_SERVICE_USER:-toowix-service@toowix.test}
      STALWART_PASSWORD: ${STALWART_SERVICE_PASSWORD}
      STALWART_ACCOUNT_ID: ${STALWART_ACCOUNT_ID:-b}
      ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@toowix.com}
      ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      TENANT_ADMIN_URL: ${TENANT_ADMIN_URL:-http://localhost:5174}
      SMTP_HOST: ${SMTP_HOST:-email.toowix.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER_EMAIL: ${SMTP_USER_EMAIL}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_ENABLE: ${SMTP_ENABLE:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SKIP_BILLING: ${SKIP_BILLING:-true}
      ENABLE_BILLING: ${ENABLE_BILLING:-false}
      ALLOW_SANDBOX_BILLING: ${ALLOW_SANDBOX_BILLING:-true}
      MAIL_SERVER_IPS: ${MAIL_SERVER_IPS}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      GODADDY_API_BASE_URL: ${GODADDY_API_BASE_URL}
    volumes:
      # backup.service.ts defaults to path.resolve(process.cwd(), 'backups'),
      # and the Dockerfile's WORKDIR is /app — must match, or backups land on
      # the container's ephemeral layer and are lost on every recreate.
      - toowix-prod-backups:/app/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - toowix-internal

  # 4a. Toowix Super Admin SPA & Reverse Proxy (Nginx)
  super-admin:
    build:
      context: ../apps/super-admin
      dockerfile: Dockerfile
    container_name: toowix-prod-super-admin
    restart: always
    ports:
      - "${PORT_ADMIN_HTTP:-5173}:80"
    depends_on:
      - backend
    networks:
      - toowix-internal
      - toowix-public

  # 4b. Toowix Tenant Admin & Onboarding SPA & Reverse Proxy (Nginx)
  tenant-admin:
    build:
      context: ../apps/tenant-admin
      dockerfile: Dockerfile
    container_name: toowix-prod-tenant-admin
    restart: always
    ports:
      - "${PORT_HTTP:-5174}:80"
    depends_on:
      - backend
    networks:
      - toowix-internal
      - toowix-public


  # 5. Bulwark JMAP Webmail (Modern Next.js client for Stalwart)
  webmail:
    image: ghcr.io/bulwarkmail/webmail:latest
    container_name: toowix-prod-webmail
    restart: always
    command: ["node", "server-proxy.js"]
    ports:
      - "${PORT_WEBMAIL:-8888}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      # Public-facing URL the BROWSER uses for JMAP discovery — must be the
      # webmail app's own address (same-origin), never Stalwart's internal
      # Docker hostname. server-proxy.js forwards /jmap/* to Stalwart
      # server-side; STALWART_URL below stays internal-only for that.
      JMAP_SERVER_URL: "${WEBMAIL_PUBLIC_URL:-https://webmail.toowix.com}"
      STALWART_INTERNAL_URL: "${STALWART_URL:-http://stalwart:8080}"
    volumes:
      - ./bulwark/server-proxy.js:/app/server-proxy.js:ro
      - toowix-prod-bulwark-settings:/app/data/settings
      - toowix-prod-bulwark-admin:/app/data/admin
    depends_on:
      - stalwart
    networks:
      - toowix-internal
      - toowix-public

  # 6. Automated Backup Worker (Scheduled Daily Cron)
  backup-cron:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: toowix-prod-backup-cron
    restart: always
    entrypoint: ["/bin/sh", "-c", "echo '0 2 * * * /app/scripts/backup-s3.sh >> /var/log/backup.log 2>&1' > /etc/crontabs/root && crond -f -l 2"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017/toowix_mail
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      S3_BUCKET: ${AWS_S3_BUCKET:-toowix-mail-backups}
      RETENTION_DAYS: 30
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - toowix-prod-backups:/var/backups/toowix
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - toowix-internal

networks:
  # Strictly internal network: isolates MongoDB and Stalwart Management HTTP (8080)
  toowix-internal:
    driver: bridge
    internal: false
  # Public facing network for web SPA and inbound mail protocols
  toowix-public:
    driver: bridge

volumes:
  toowix-prod-mongodata:
  toowix-prod-stalwart-etc:
  toowix-prod-stalwart-data:
  toowix-prod-bulwark-settings:
  toowix-prod-bulwark-admin:
  toowix-prod-backups:
